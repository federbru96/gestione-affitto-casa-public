name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          # Rimuove l'eventuale slash finale dall'URL
          CLEAN_URL=$(echo "${{ secrets.SUPABASE_URL }}" | sed 's/*$//')
          
          # Esegue la chiamata salvando risposta e status code
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "${CLEAN_URL}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          status_code=$(echo "$response" | grep "HTTP_STATUS:" | cut -d':' -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')
          
          echo "Supabase Response Status: $status_code"
          echo "Response Body: $body"
          
          if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 300 ]; then
            echo "Database contattato con successo!"
            exit 0
          else
            echo "Errore durante la chiamata API (Status code: $status_code)"
            exit 1
          fi
